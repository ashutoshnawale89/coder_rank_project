spring.application.name=coderank

# Server
server.port=${SERVER_PORT:8080}

# MySQL DataSource (env-overridable)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coder_rank?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:Zm9vYmFyYmF6cXV4Y29kZXJhbmtzZWNyZXRrZXlmb3JqdzAxMjM0NTY3ODk=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Docker sandbox
app.docker.enabled=${DOCKER_ENABLED:true}
app.docker.timeout-seconds=${DOCKER_TIMEOUT:40}
app.docker.memory=${DOCKER_MEMORY:256m}
app.docker.cpus=${DOCKER_CPUS:0.5}
app.docker.pids-limit=${DOCKER_PIDS_LIMIT:64}
app.docker.workdir=${DOCKER_WORKDIR:/tmp/coderank}

# Executor pool
app.executor.core-pool-size=${EXECUTOR_CORE:4}
app.executor.max-pool-size=${EXECUTOR_MAX:8}
app.executor.queue-capacity=${EXECUTOR_QUEUE:20}

# Rate limit
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:10}

# CORS — comma-separated origins allowed to call the API from a browser
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Admin seed (created on first start if no ADMIN exists and ADMIN_PASSWORD is set)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@coderank.local}
app.admin.password=${ADMIN_PASSWORD:}

# Swagger
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
